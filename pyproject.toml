[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json2csv"
version = "1.0.0"
description = "Herramienta de linea de comandos para convertir JSON a CSV con arquitectura de filtros."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Valentin Romero" }]
keywords = ["json", "csv", "conversion", "cli", "pipeline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "bandit>=1.7",
    "pdoc>=14.0",
]

[project.scripts]
json2csv = "json2csv_tool.cli:main"

[project.urls]
Homepage = "https://github.com/vvalenromero/json2csv"
Source = "https://github.com/vvalenromero/json2csv"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

# --- Formato y estilo (PEP8 / PEP257) -------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: errores de estilo
    "W",   # pycodestyle: advertencias de estilo
    "F",   # pyflakes: nombres y variables sin usar
    "I",   # isort: orden de las importaciones
    "N",   # pep8-naming: convenciones de nombres
    "D",   # pydocstyle: PEP257
    "UP",  # pyupgrade: sintaxis moderna
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplificaciones
    "PTH", # usar pathlib en lugar de os.path
    "RET", # retornos consistentes
    "RUF", # reglas propias de ruff
    "S",   # bandit: seguridad
]
ignore = [
    "D203", # incompatible con D211
    "D213", # incompatible con D212
    "S101", # assert es la herramienta de los tests
    "N818", # las excepciones se nombran en espanol, con el prefijo Error
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D101", "D102", "D103", "S603", "S607"]
"json2csv.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Formato consistente --------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = '\.venv|build|dist|docs'

# --- Tipado estático ------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist", "docs"]
# El paquete vive en src, que no es un directorio de importacion por omision.
extraPaths = ["src"]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
pythonVersion = "3.10"

# --- Seguridad ------------------------------------------------------------

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist", "docs"]
targets = ["src"]
skips = []

# --- Pruebas y cobertura --------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    # El modo de captura se fija en "sys" y no se deja el "fd" por omision.
    # En Windows, el modo "fd" redirige los descriptores 1 y 2 del proceso a
    # archivos temporales, y subprocess falla al duplicar esos descriptores
    # para crear el proceso hijo: el hijo no arranca y aparece un
    # "OSError: [WinError 6] Controlador no valido". Los casos de extremo a
    # extremo de este proyecto lanzan subprocesos, asi que necesitan un modo
    # de captura que no interfiera con la creacion de procesos.
    # Verificado con una prueba minima ajena al proyecto: con "fd" fallaba de
    # forma intermitente y con "sys" pasa siempre.
    "--capture=sys",
    "--cov=json2csv_tool",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/json2csv_tool"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pdoc]
output-dir = "docs/api"
